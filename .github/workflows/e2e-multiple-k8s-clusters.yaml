name: "e2e-multiple-k8s-clusters"
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
  push:
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
    branches:
      - "main"
permissions:
  contents: read

# Cancel any ongoing workflows on the same branch to avoid unnecessary fees.
# cf. https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-concurrency-and-the-default-behavior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version:
          - 1.35.1
        backup-transfer-part-size:
          - 3Mi # smaller than the PVC size
        # TEMPORARY: this branch only exists to demonstrate the
        # primary-expire-mid-transfer bug and is not intended to be merged,
        # so the matrix is trimmed down to just the new investigation spec
        # (test/e2e/multik8s/expire_mid_transfer_test.go) instead of the
        # full label-filter list. Restore the full matrix before merging
        # anything from this branch.
        label-filter:
          - investigate-expire-mid-transfer
    #runs-on: "ubuntu-22.04"
    runs-on: mantle_large_runner_16core
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - run: sudo apt-get update
      - uses: ./.github/actions/set-up-kvm-for-e2e-tests
      - run: make -C test/e2e setup KUBERNETES_VERSION=${{ matrix.kubernetes-version }}
      - run: |
          make -C test/e2e test-multiple-k8s-clusters \
            KUBERNETES_VERSION=${{ matrix.kubernetes-version }} \
            BACKUP_TRANSFER_PART_SIZE=${{ matrix.backup-transfer-part-size }} \
            GINKGO_FLAGS=--label-filter='${{ matrix.label-filter }}'
