name: "e2e"
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
      - "LICENSE"
      - "NOTICE"
  push:
    paths-ignore:
      - "**/*.md"
      - "CODEOWNERS"
      - "LICENSE"
      - "NOTICE"
    branches:
      - "main"
permissions:
  contents: read
  id-token: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        kubernetes-version:
          - 1.36.4
          - 1.35.8
        label-filter:
          - restore
          - "!restore"
    runs-on: "ubuntu-22.04"
    timeout-minutes: 60
    env:
      APT_MIRRORS_FILE: /etc/apt/apt-mirrors.txt
    steps:
      - name: Check the disk information
        run: lsblk
      - name: Disk cleanup
        run: |
          # These code are copied from the following code:
          # https://github.com/shiguredo-webrtc-build/webrtc-build/blob/5a821e430b496bbff74cf45bab058ab4ac340c2c/.github/workflows/build.yml#L138-L147
          #    LICENSE: http://www.apache.org/licenses/LICENSE-2.0
          #    Copyright 2019-2025, Shiguredo Inc.
          df -h
          avail_gib=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          if [ "${avail_gib}" -ge 50 ]; then
            echo "Skip the cleanup because ${avail_gib} GiB is available."
            exit 0
          fi
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          takumi-guard-bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
      - run: sudo apt-get update
      - uses: ./.github/actions/set-up-kvm-for-e2e-tests
      - run: make -C test/e2e setup KUBERNETES_VERSION=${{ matrix.kubernetes-version }}
      - run: |
          make -C test/e2e test \
            KUBERNETES_VERSION=${{ matrix.kubernetes-version }} \
            GINKGO_FLAGS=--label-filter='${{ matrix.label-filter }}' \
            MINIKUBE_CPUS=4
