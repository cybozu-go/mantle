name: "ceph custom export-diff test"
on:
  pull_request:
    paths:
      - "ceph/**"
      - "!ceph/README.md"
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: mantle_large_runner_16core
    timeout-minutes: 240
    steps:
      - run: sudo apt-get update
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          takumi-guard-bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          # The default 1800s token lifetime expires during the build below,
          # which takes over an hour. Cover the whole 240-minute job.
          takumi-guard-expires-in: "14400"
      - uses: ./.github/actions/set-up-kvm-for-e2e-tests
      - run: make -C ceph setup
      - run: make -C ceph build
      - run: make -C ceph test
