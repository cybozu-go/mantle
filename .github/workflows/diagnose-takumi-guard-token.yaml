name: "diagnose Takumi Guard token"
# Temporary workflow to find out how long a Takumi Guard access token stays valid.
# Do not merge.
on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-takumi-guard-token.yaml"
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PROBE_URL: https://golang.flatt.tech/github.com/peak/s5cmd/v2/@v/v2.3.0.info
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: "go.mod"
          takumi-guard-bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          # Same lifetime as the ceph export-diff test.
          takumi-guard-expires-in: "14400"
      - name: Record the start time and show the token claims
        run: |
          echo "TOKEN_START=$(date +%s)" >> "$GITHUB_ENV"
          date -u
          python3 - <<'PY'
          import base64, json, os, re, time
          netrc = open(os.path.expanduser("~/.netrc")).read()
          token = re.search(r"machine golang\.flatt\.tech login \S+ password (\S+)", netrc).group(1)
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          now = int(time.time())
          print("claims:", json.dumps(claims, indent=2, sort_keys=True))
          if "iat" in claims and "exp" in claims:
              print("exp - iat =", claims["exp"] - claims["iat"], "seconds")
          if "exp" in claims:
              print("exp - now =", claims["exp"] - now, "seconds")
          PY
      - name: Probe the proxy with the token every 5 minutes
        run: |
          fails=0
          for i in $(seq 1 40); do
            code=$(curl --netrc-file "$HOME/.netrc" -sS -o "$RUNNER_TEMP/body" -w '%{http_code}' "$PROBE_URL" || true)
            age=$(( $(date +%s) - TOKEN_START ))
            echo "$(date -u +%H:%M:%S) age=${age}s status=${code} body=$(head -c 200 "$RUNNER_TEMP/body" | tr '\n' ' ')"
            if [ "$code" != "200" ]; then
              fails=$((fails + 1))
            fi
            if [ "$fails" -ge 3 ]; then
              break
            fi
            sleep 300
          done
      - name: Get a new token
        if: ${{ !cancelled() }}
        uses: flatt-security/setup-takumi-guard-golang@1c8aa7498f7f635fbd6ad6a0f436d03092b3502d # v1.1.0
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          expires-in: "14400"
      - name: Probe the proxy with the new token
        if: ${{ !cancelled() }}
        run: |
          code=$(curl --netrc-file "$HOME/.netrc" -sS -o "$RUNNER_TEMP/body" -w '%{http_code}' "$PROBE_URL" || true)
          echo "status with the new token: ${code}"
