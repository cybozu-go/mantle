image:
  repository: controller
  pullPolicy: IfNotPresent
  reference: latest

controller:
  overwriteMBCSchedule: "* * * * *"
  gcInterval: 1s
  readinessProbe:
    initialDelaySeconds: 0
    periodSeconds: 1
  env:
    - name: REQUEUE_RECONCILIATION_AFTER
      value: "1s"
    - name: SLOW_REQUEUE_RECONCILIATION_AFTER
      value: "1m"
